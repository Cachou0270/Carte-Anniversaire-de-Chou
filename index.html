<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Indispensable pour l'adaptation parfaite sur mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joyeux Anniversaire ! 🎂</title>

  <!-- Bibliothèque pour l'effet confettis -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- ÉTAPE 1 : ENVELOPPE --- */
    .envelope-wrapper {
      width: 100%;
      height: 220px;
      position: relative;
      background: #ff6b81;
      border-radius: 12px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:active {
      transform: scale(0.98);
    }

    .envelope-text {
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
    }

    /* --- ÉTAPE 2 : CARTE (Cachée au début) --- */
    .card {
      display: none;
      background: white;
      width: 100%;
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .title {
      color: #ff4757;
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .message {
      color: #4b6584;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* --- GÂTEAU & BOUGIE --- */
    .cake-container {
      margin: 20px 0;
      position: relative;
      display: inline-block;
      cursor: pointer;
    }

    .cake {
      font-size: 80px;
      line-height: 1;
      position: relative;
    }

    .flame {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      animation: flicker 0.6s infinite alternate;
      transition: opacity 0.3s, transform 0.3s;
    }

    .flame.off {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px) scale(0);
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
    }

    .instruction {
      font-size: 0.9rem;
      color: #8854d0;
      font-weight: 600;
      margin-top: 5px;
    }

    /* --- BOUTON REPLAY --- */
    .btn-action {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      max-width: 260px;
      transition: transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. L'enveloppe à toucher -->
    <div class="envelope-wrapper" id="envelope" onclick="openCard()">
      <div class="envelope-text">
        💌 Tu as reçu une carte !<br>
        <small style="font-size: 0.8rem; font-weight: normal; opacity: 0.9;">(Touche pour ouvrir)</small>
      </div>
    </div>

    <!-- 2. La carte d'anniversaire -->
    <div class="card" id="card">
      <h1 class="title">Joyeux Anniversaire ! 🎉</h1>
      
      <p class="message">
        Que cette journée soit remplie de joie, de rires, de bonheur et de belles surprises ! 💖
      </p>

      <!-- Gâteau interactif -->
      <div class="cake-container" onclick="blowOutCandle()">
        <div class="flame" id="flame">🔥</div>
        <div class="cake">🎂</div>
        <div class="instruction" id="cake-hint">Touche le gâteau pour souffler la bougie !</div>
      </div>

      <button class="btn-action" onclick="triggerConfetti()">Fêter ça ! ✨</button>
    </div>

  </div>

  <script>
    let candleBlown = false;

    // Fonction pour ouvrir l'enveloppe
    function openCard() {
      document.getElementById('envelope').style.display = 'none';
      const card = document.getElementById('card');
      card.style.display = 'block';
      
      // Lancer de confettis à l'ouverture
      triggerConfetti();
    }

    // Fonction pour éteindre la bougie
    function blowOutCandle() {
      if (!candleBlown) {
        document.getElementById('flame').classList.add('off');
        document.getElementById('cake-hint').innerText = "La bougie est éteinte ! 🥳";
        document.getElementById('cake-hint').style.color = "#2ed573";
        candleBlown = true;
        
        // Explosion de confettis
        triggerConfetti();
      }
    }

    // Fonction d'animation des confettis
    function triggerConfetti() {
      // Confettis depuis la gauche et la droite pour mobile
      confetti({
        particleCount: 60,
        spread: 60,
        origin: { x: 0.2, y: 0.6 }
      });
      confetti({
        particleCount: 60,
        spread: 60,
        origin: { x: 0.8, y: 0.6 }
      });
    }
  </script>

</body>
</html>
